<!doctype html>
<html lang="en" xmlns="http://www.w3.org/1999/html">
<head title="Font matching prototype">
</head>

<script src="/static/js/utils.js"></script>

    <style>
        /* Container that aligns the tables horizontally */
        .table-container {
            display: flex;
            gap: 20px; /* Adds space between the two tables */
            justify-content: space-between; /* Spreads them evenly */
        }

        /* Makes sure each table scales correctly */
        .table-container table {
            width: 48%; /* Adjust width as needed so both fit side-by-side */
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f4f4f4;
        }
        thead {
            font-size: 18px;

        }
        /* Responsive Design: Stacks tables vertically on smaller screens */
        @media (max-width: 600px) {
            .table-container {
                flex-direction: column;
            }
            .table-container table {
                width: 100%;
            }
        }
    </style>

<style>
    {% for font in unicode_font_list%}
    @font-face {
      font-family:"{{font | replace('.ttf', '') }}";
      src:url('{{font_base}}/unicode/{{font}}');
    }
    {% endfor %}
    {% for font in hacked_font_data%}
    @font-face {
      font-family:"{{font.family_name | replace('.ttf', '') }}";
      src:url('{{font.path}}');
    }
    {% endfor %}
  .selected-cell {
    background-color: green;
  }
  .yellow-cell {
    background-color: yellow;
  }
  .unselected-cell {
    background-color: white;
  }

</style>

<style>
    .word-matrix {
      border-collapse: collapse;
      font-family: sans-serif;
      margin: 10px 0;
      margin-right: 10px;
      font-size:24px;
    }
    .word-matrix td {
      border: 1px solid #ccc;
      padding: 10px;
      text-align: center;
    }

    caption {
      font-size: 18px;
    }

    table {
      float: left;
      padding: 15px;
      }
</style>

<script>
    // GLOBALS

    const lang_code = '{{lang_code}}';
    const lang_name = '{{lang_name}}';

    // Read and updated information on the font conversions
    const conversion_data = {{conversion_data | tojson}};
    let conversion_rules = {};

    // Mapped from encoding font names
    let encoding_font_data = {};

    let latest_time_stamp;
    if (conversion_data) {
        latest_time_stamp = conversion_data['timestamp'];
        conversion_rules = conversion_data['font_conversions']
    }
    const date_of_last_save = new Date(latest_time_stamp);

    const hacked_font_list = {{hacked_font_list | tojson}};
    const unicode_font_list = {{unicode_font_list | tojson}};

    // Number of elements in each row of the table
    let itemsPerRow = 8;

    // The results of the selections so far.
    let conversion_rules_updated = false;

    let hacked_cell_selected = null;
    let unicode_cells_selected = [];

    let current_hacked_font = '{{hacked_font_data[0].family_name}}';
    let current_unicode_font = '{{unicode_font_data[0].family_name}}';

    const best_matches = {{best_matches_json | tojson}};

    let hacked_ranges;
    let best_match_data;

    let font_a;
    let font_b;
    if (best_matches) {
        hacked_ranges = best_matches['best_matches'].keys();
        best_match_data = best_matches.best_matches;
        font_a = best_matches.font_a;
        font_b = best_matches.font_b;
    }
    let hacked_char_to_cell = {};
    let conversions_by_hack_code = {};

    const hacked_code_defined_color = 'lightgray';

    let text_to_cell = {
      'hacked_font_table': {},
      'unicode_font_table': {}
    };

    let add_button = null;  // initialized on page load
    let rule_count = 0;
    // Append when a value needs to be reordered on conversion, e.g., U+1031
    const reorder_code = '\u200c';

    // From Gemini
    const range = (a, b) => Array.from({ length: b - a + 1 }, (_, i) => a + i);

    function initializePage() {
      let hacked_tds;
      let unicode_tds;
      hacked_tds = document.querySelectorAll('#hacked_font_table td');
      unicode_tds = document.querySelectorAll('#unicode_font_table td');
      setListener(hacked_tds, hacked_listener);
      setListener(unicode_tds, unicode_listener);

      current_hacked_font = '{{hacked_font_data[0].family_name}}';
      current_unicode_font = '{{unicode_font_data[0].family_name}}';
      add_button = document.getElementById('add_rule_button');

      if (conversion_data['unicode_ranges_hex']) {
        let range_id = document.getElementById('unicode_ranges');
        range_id.value = conversion_data['unicode_ranges_hex'];
      }

      load_rule_table(conversion_rules, current_hacked_font);  // Initialize from previous rules.
      setFontFamilyHacked(current_hacked_font, 'hacked_font_table');
      setFontFamily(current_unicode_font, 'unicode_font_table');
      set_font_ranges('hacked_font_table');
      set_font_ranges('unicode_font_table');
    }

    function setListener(cells, handler) {
      cells.forEach(cell => {
        cell.addEventListener('click', (event) => {
          // Access the internal text of the specific clicked cell
          handler(cell);
      });

     window.addEventListener('beforeunload', (event) => {
        // Cancel the event as stated by the standard.
        if (conversion_rules_updated) {
            event.preventDefault();
        }

        // Older browsers require a returnValue to be set.
       event.returnValue = '';
       });
});
  }

    // Handle the clicks on table entries
    function hacked_listener(item) {
      alert('hacked =' + item.textContent);
    }
    function unicode_listener(item) {
      alert('unicode =' + item.textContent);
    }

  function parseRanges(string) {
  if (!string || typeof string !== 'string') return [];

  return string
    .replace(/\s+/g, '') // Remove all whitespace
    .split(',')          // Split by comma
    .filter(Boolean)     // Remove empty strings (e.g., from trailing commas)
    .flatMap(part => {
      if (part.includes('-')) {
        const [startStr, endStr] = part.split('-');
        const start = parseInt(startStr, 16);
        const end = parseInt(endStr, 16);

        // Validate range inputs
        if (isNaN(start) || isNaN(end)) {
          throw new Error(`Invalid hexadecimal range: ${part}`);
        }
        if (start > end) {
          throw new Error(`Start of range cannot be greater than end: ${part}`);
        }

        // Create an array containing all numbers in the range
        return Array.from({ length: end - start + 1 }, (_, i) => start + i);
      }

      // Handle single numbers
      const singleNum = parseInt(part, 16);
      if (isNaN(singleNum)) {
        throw new Error(`Invalid hexadecimal number: ${part}`);
      }

      return singleNum; // flatMap automatically wraps single return values in an array
    });
}

    function set_font_ranges(table_id) {
      // Start parsing for ranges and single values
      // e.g., '40-7f,131,2219' --> a range plus two single values
      // 1. Split by comma and space
      // 2. For each split, if not empty, check for '-'.
      //   a. Yes --> split by '-', then add code points from start and end, converted from hex
      //   b. No --> add single code point, converting from hex
      // NOTE: accept 0x or U+ or \u at the start of hex valu
      let range_id;
      if (table_id == 'hacked_font_table') {
          range_id = document.getElementById('hacked_ranges');
      } else {
          range_id = document.getElementById('unicode_ranges');
      }
      const ranges = parseRanges(range_id.value);
      load_table_with_font_from_list(table_id, ranges);

      return;
      // Old code
      const hacked_start = parseInt(document.getElementById('hacked_start').value, 16);
      const hacked_end = parseInt(document.getElementById('hacked_end').value, 16);
      const unicode_start = parseInt(document.getElementById('unicode_start').value, 16);
      const unicode_end = parseInt(document.getElementById('unicode_end').value, 16);
      if (table_id == 'hacked_font_table') {
        load_table_with_font(table_id, hacked_start, hacked_end);
      } else {
        load_table_with_font(table_id, unicode_start, unicode_end);
      }
    }

    let possible_cells = [];

    function clear_possible_colors() {
      for (const cell of possible_cells) {
        cell.style.backgroundColor = 'white';
      }
      possible_cells = [];
    }

    function hacked_cell_click_fn(cell) {
      if (cell.style.backgroundColor == 'lightgreen') {
        // Deselect
        cell.style.backgroundColor = 'white';
        hacked_cell_selected = null;
      } else {
        if (hacked_cell_selected) {
          // Deselect other one
          hacked_cell_selected.style.backgroundColor = 'white';
        }
        cell.style.backgroundColor = 'lightgreen';
        hacked_cell_selected = cell;
        const code = cell.textContent;
        // Clear all those with 'lavender' background
        clear_possible_colors();

        if (! best_match_data) {
            return
        }

        // Show the possible ones.
        const possibles = best_match_data[code];
        let count = 0;
        for (const item of possibles) {
          let possible_code = item[0].codePointAt(0);
          let cell = text_to_cell['unicode_font'][possible_code];
          let color = 'lavender';
          if (count == 0) { color = 'plum'; }
          if (cell) {
            cell.style.backgroundColor = color;
            possible_cells.push(cell);
          }
          count ++;
        };
      }
    }

    function unicode_cell_click_fn(cell) {
        // Clear all those with 'lavender' background
        clear_possible_colors();

        if (cell.style.backgroundColor == 'lightblue') {
        // Deselect
        cell.style.backgroundColor = 'white';
        // Remove from list of unicode conversions
        const index = unicode_cells_selected.indexOf(cell);
        if (index > -1) {
          unicode_cells_selected.splice(index, 1); // Modifies the original array, removing 1 item at 'index'
        }
      } else {
        cell.style.backgroundColor = 'lightblue';
        unicode_cells_selected.push(cell);
      }

      if (hacked_cell_selected && unicode_cells_selected.length > 0) {
        add_button.disabled = false;
      } else {
        add_button.disabled = true;
      }

      // Clear all those with 'lavender' background
      clear_possible_colors()
    }

    function load_table_with_font_from_list(table_id, codepoint_list) {
      load_table_with_font(table_id, codepoint_list);
    }

    function load_table_with_font(table_id, start, end) {
      // Get the font
      // Remove current table contents
        const table = document.getElementById(table_id);
        const text_to_cell_map = text_to_cell[table_id];

        // Use tbody if it exists, otherwise fallback to the table itself
        const tableBody = table.querySelector('tbody') || table;
        if (tableBody) {
            while (table.rows.length > 0) {
                table.deleteRow(0);
            }
        }

      // Create an array from input values
      let itemsArray;
      if (Array.isArray(start)) {
          // Create an array from start to end
          itemsArray = start.map(code => String.fromCodePoint(code));
      } else {
         itemsArray = range(start, end);
      }

      // Code from Gemini
      // Loop over start to end, creating new tds with
      // new row every row_size items
        let currentRow = null;

        itemsArray.forEach((itemText, index) => {
            // Create a new row at the start, or whenever we hit a multiple of M
            if (index % itemsPerRow === 0) {
                currentRow = document.createElement('tr');
                tableBody.appendChild(currentRow);
            }

            // Create the cell (td) and append it to the current row
            const td = document.createElement('td');
            td.textContent = itemText;
            td.title = td.textContent + ' ==  (0x' + itemText.codePointAt(0).toString(16) + ')';
            currentRow.appendChild(td);

            // Set up onclick functions
            if (table_id == 'hacked_font_table') {
                td.addEventListener("click", function() {
                  hacked_cell_click_fn(td);
                });
                td.style.fontFamily = current_hacked_font;
                // Remember the cells that are set
                hacked_char_to_cell[td.textContent] = td;
            } else {
                td.addEventListener("click", function() {
                  unicode_cell_click_fn(td);
                });
                td.style.fontFamily = current_unicode_font;
            }
            // Record where the code is stored for quick access.
            text_to_cell_map[itemText] = td;
      });

      // Set text to be the character with the code, and
      // and add the code point in hex too.
    }

    function load_rule_table(conversion_rules, hacked_font) {
      // Load with the pre-loaded conversion rules.
      rule_count = 0;  // Don't overwrite the headers.
      const rule_table = document.getElementById('rule_table');
      // Clear current contents.
      document.querySelector("#rule_table tbody").innerHTML = "";

      if (! conversion_rules) return;
      if (! (current_hacked_font in conversion_rules)) return;

      // Rules for each encoding font so far defined
      const encoding_font_data = conversion_rules[hacked_font];
      if (! encoding_font_data) return;
      let mapping = encoding_font_data['conversion_rules'];

      if (! mapping) return;

      // Put each rule into the table
      for (const [key, value] of Object.entries(mapping))  {
        add_conversion_rule_to_table(key, value);
        }

      // TODO: Highlight the data in the hacked font table for those that
      // are already defined.

      if ('encoding_ranges_hex' in encoding_font_data) {
          const font_range_id = document.getElementById('hacked_ranges');
          font_range_id.value = encoding_font_data['encoding_ranges_hex'];
      }
      setFontFamily(current_hacked_font, 'hacked_font_table');

    }

    function write_selection_to_rules() {
      const rule_table = document.getElementById('rule_table');
      let values = [];
      for (cell of unicode_cells_selected) {
        values.push(cell.textContent);
        cell.style.backgroundColor = 'white';
      }
      const reorder_item = document.getElementById('reorder_flag');
      add_conversion_rule_to_table(hacked_cell_selected.textContent, values,
        reorder_item.checked);
      // Clear the selections
      // Mark the hacked code visibly as defined already.
      hacked_cell_selected.style.backgroundColor = hacked_code_defined_color;
      hacked_cell_selected = null;

      unicode_cells_selected = [];
      add_rule_button.disabled = true;

      // Remember that there's something new.
      conversion_rules_updated = true;
    }

    function add_conversion_rule_to_table(key, values, reorder_flag) {
      const rule_table = document.getElementById('rule_table');

      if (Object.hasOwn(conversions_by_hack_code, key)) {
        const text = 'There is already a rule for ' + key + ' : ' +
            conversions_by_hack_code[key] + '\nAdd new?';
        if (! confirm(text)) {
          alert('Cancelled');
        }
      }

      // Add a row to the table
      rule_count += 1;
      const newRow = rule_table.insertRow(-1);
      const cell1 = newRow.insertCell(0);
      cell1.textContent = rule_count;

      const cell2 = newRow.insertCell(1);
      cell2.textContent = key;
      const code_point = cell2.textContent.codePointAt(0)
      cell2.title = cell2.textContent + ' ==  (0x' + code_point.toString(16) + ')';
      cell2.style.fontFamily = current_hacked_font;

      const cell3 = newRow.insertCell(2);
      // Assemble the text from the output cells selected
      cell3.style.fontFamily = current_unicode_font;

      // compute the hex for each code point and concatenate
      let rule_output = '';
      let hex_output = '';
      for (const value of values) {
        rule_output += value;
        const code_point = value.codePointAt(0)
        hex_output += '0x' + code_point.toString(16) + ' ';
      }
      cell3.title = hex_output;

      const cell4 = newRow.insertCell(3);
      if (reorder_flag) {
        const reorder_code = '\u200c';
        rule_output += reorder_code;
        hex_output += '0x' + 0x200c.toString(16) + ' ';

        cell4.textContent = "yes";
        cell4.style.backgroundColor = 'lightsalmon';
      }

      cell3.textContent = rule_output;
      conversions_by_hack_code[key] = rule_output;

      clear_possible_colors();

      // Add way to delete this one.
      const cell5 = newRow.insertCell(4);
      let button = document.createElement('button');
      button.type = 'button';
      button.innerText = 'Delete';
      button.className = 'btn-danger';
      button.onclick = (function(entry) { delete_rule(rule_table, newRow); } );
      // Append the delete button to the td cell
      cell5.appendChild(button);
      if (cell3.textContent.length > 1) {
          let button2 = document.createElement('button');
          button2.type = 'button';
          button2.innerText = 'Flip diacritics';
          button2.className = 'btn-danger';
          button2.onclick = (function (entry) {
              flip_rule_diacritics(rule_table, cell3);
          });
          cell5.appendChild(button2);
      }
      // Reset the color of the item to defined.
      hacked_cell = hacked_char_to_cell[key];
      if (hacked_cell) {
        hacked_cell.style.backgroundColor = hacked_code_defined_color;
      }
      const reorder_check = document.getElementById('reorder_flag');
      reorder_check.checked = false;
    }

    // Click on rule # to delete
    function delete_rule(rule_table, row_object) {
      let text = "Delete this row?";
      let index_to_remove = row_object.rowIndex;
      const hacked_code = row_object.cells[0].textContent
      if (confirm(text)) {
        let row_number = parseInt(row_object.cells[0].textContent);
        rule_table.deleteRow(index_to_remove);
        delete conversions_by_hack_code[hacked_code];
        // rule_count -= 1;
      } else {
        // alert("No change made");
      }

      // Make sure the old definition is removed.
      delete conversions_by_hack_code[hacked_code];

      // Reset the color of the item to defined.
      hacked_cell = hacked_char_to_cell[hacked_code];
      if (hacked_cell) {
        hacked_cell.style.backgroundColor = 'white';
      }
    }
    function flip_rule_diacritics(rule_table, cell_to_flip) {
      // Get the characters and flip the order in the Unicode part
      let text_to_change = cell_to_flip.textContent;
      let new_text = text_to_change[1] + text_to_change[0];
      cell_to_flip.textContent = new_text;
    }

    function current_rules_to_dictionary() {
      let rules_text = '';
      let rules_dictionary = {};
      let row_count = 0;
      for (const row of rule_table.rows) {
        let row_text = '';
        const cells = row.cells;
        if (row_count > 0) {
        rules_text += cells[0].textContent + ': ' + cells[1].textContent + ' --> ' +
          cells[2].textContent + '\n';

          rules_dictionary[cells[1].textContent] = cells[2].textContent;
          // TODO: keep information about reordering.
        }
        row_count += 1;
      }
      return rules_dictionary
    }

    function save_rules_to_server() {
      const rule_table = document.getElementById('rule_table');

      let rules_dictionary = current_rules_to_dictionary();

      // Save the rules and write to a JSON structure
      const data_to_server = {
        'lang_code': lang_code,
        'lang_name': lang_name,
        'unicode_ranges_hex': document.getElementById('unicode_ranges').value,
        'data_type': 'conversion_rules',
          // Dictionary for this font name
          // TODO: don't loose previous data.
          'font_conversions': {},
      };

      // Add the latest rules
      data_to_server['font_conversions'][current_hacked_font] = {
                  'encoding_ranges_hex': document.getElementById('hacked_ranges').value,
                  'conversion_rules': rules_dictionary,
              };
      const number_of_rules = Object.keys(rules_dictionary).length;
      alert('DATA_TO_SERVER: %s' % str(data_to_server))

      // Send the POST request to the Flask server
      const json_to_send = JSON.stringify(data_to_server);
        fetch('/save_matcher_conversion', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json' // Tells Flask that JSON is coming
            },
            body: json_to_send // Converts JS object to JSON string
        })
        .then(response => response.json()) // Parses the JSON response from Flask
        .then(data => {
            alert('Success storing ' + number_of_rules + ' conversion rules' + '\n' + response);
        })
        .catch(error => {
            alert('Error storing conversions:', error);
        });
      conversion_rules_updated = false;
    }

  function setFontFamilyHacked(newFontFamily, table_id) {
      // Put current rule set into global rules
      conversion_rules[current_hacked_font] = current_rules_to_dictionary();
      // Reset the font in tables
      setFontFamily(newFontFamily, table_id);

      // Load existing rules from conversion_rules
      load_rule_table(conversion_rules, newFontFamily);

      // Set the hacked ranges, too
      if (newFontFamily in conversion_rules) {
          const ranges = conversion_rules[newFontFamily]['encoding_ranges_hex'];
          if (ranges) {
              const range_id = document.getElementById('hacked_ranges');
              range_id.value = ranges;
              set_font_ranges(table_id);
          }
      }

  }

  function setFontFamily(newFontFamily, table_id, resetKeyboard=true) {
      const table_element = document.getElementById(table_id);
      for (const row of table_element.rows) {
        for (const cell of row.cells) {
          cell.style.fontFamily = newFontFamily;
        }
      }
    const table_caption = table_element.caption;
    table_caption.textContent = newFontFamily;

    let rule_table_column = 1;
    if (table_id == 'unicode_font_table') {
        current_unicode_font = newFontFamily;
        rule_table_column = 2;
    } else {
        current_hacked_font = newFontFamily;
    }
    const rules_table = document.getElementById('rule_table');
    // Except the first row
    for (let i = 1; i < rules_table.rows.length; i++) {
        const row = rules_table.rows[i];
        row.cells[rule_table_column].style.fontFamily = newFontFamily;
    }
  }

</script>

<body onload="initializePage()">

<h1>Hacked {{lang_name}} to Unicode</h1>

<label for="hacked_ranges">Hacked ranges hex: </label>
<input type="text" id="hacked_ranges" size=40 name="hacked_ranges"value="0020-007f">
<input type="button" id="update_range_hacked" onclick="set_font_ranges('hacked_font_table');"
       value="Update hacked font range">
<br />
<label for="unicode_ranges">Unicode ranges hex: </label>
<input type="text" id="unicode_ranges" size=40 name="unicode_ranges"value="0020-007f, c0-f7, 140-14f, 310-31f">
<input type="button" id="update_range_unicode" onclick="set_font_ranges('unicode_font_table');"
       value="Update unicode font ranges">
<br />
<br />

  Encoding Font: <select onchange="setFontFamilyHacked(this.value, 'hacked_font_table')" id="hacked_fontSelector">
    {% for font in hacked_font_data %}
    <option value="{{font.family_name}}"{% if loop.index == 1 %} selected{%endif%}>{{font.full_name}}</option>
    {% endfor %}
    <option value="Arial">Arial</option>
  </select>
    Unicode Font: <select onchange="setFontFamily(this.value, 'unicode_font_table')" id="unicodefontSelector">
    {% for font in unicode_font_data %}
    <option value="{{font.family_name}}"{% if loop.index == 1 %} selected{%endif%}>{{font.full_name}}</option>
    {% endfor %}
    <option value="Arial">Arial</option>
  </select>
<br />

<br />
<input type="button" id="add_rule_button" onclick="write_selection_to_rules();"
       disabled="true" value="Add to rule list">
<input type="checkbox" id="reorder_flag">Diacritic on left?</input>

</div>
<br />
<input type="button" id="rule_to_text_button" onclick="save_rules_to_server();"
        value="Save rules to file">

<div class="table-container">
<div id="hacked_table">
<table class="word-matrix" id="hacked_font_table">
    <caption id="hacked_table_font">{{hacked_font_data[0].family_name}}</caption>

    <tr>
    </tr>

</table>
</div>

<div id="unicode_table">
<table class="word-matrix" id="unicode_font_table">
    <caption>{{unicode_font_data[0].family_name}}</caption>

    <tr>
    </tr>
</table>
</div>

<table class="word-matrix" id="rule_table">
    <caption>Convert rules</caption>
    <thead>
        <td>rule #</td>
        <td>old char</td>
        <td>new chars</td>
        <td>special</td>
    </thead>
    <tbody></tbody>

</table>
</div>
<br />
</body>
</html>
